server {
    listen 80;
    server_name synergy-login.depedimuscity.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name synergy-login.depedimuscity.com;

    # SSL Certificates (adjust paths to your actual cert files)
    ssl_certificate     /etc/ssl/certs/depedimuscity.com.crt;
    ssl_certificate_key /etc/ssl/private/depedimuscity.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ─── Frontend (IDP Client - React SPA) ───────────────────────────────────
    root /var/www/educ/synergy-login;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Backend API (IDP Server - Node.js) ──────────────────────────────────
    # Proxy all /api requests to the Node.js backend running on port 5202
    location /api/ {
        proxy_pass         http://127.0.0.1:5202;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;

        # Allow all HTTP methods (GET, POST, PUT, DELETE, PATCH, OPTIONS)
        proxy_method       $request_method;
    }

    # ─── Uploaded files / storage ────────────────────────────────────────────
    location /uploads/ {
        alias /educ/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
